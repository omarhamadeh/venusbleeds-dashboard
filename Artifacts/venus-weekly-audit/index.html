<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Venus Weekly Audit",
  "schemaVersion": 1,
  "description": "Venus Bleeds weekly content audit dashboard. Shows stats, priority list, what went out, pattern flags, what to kill, and one unsolicited observation. Run every Monday."
}
</script>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venus Bleeds — Weekly Audit</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #f0ebe3;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }
    .header {
      padding: 28px 20px 22px;
      border-bottom: 1px solid #1e1e1e;
    }
    .wordmark { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #c41e3a; margin-bottom: 6px; }
    .title { font-size: 24px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; }
    .subtitle { font-size: 11px; color: #505050; margin-top: 5px; }

    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 72px 20px; gap: 20px;
    }
    .dots { display: flex; gap: 9px; }
    .dot {
      width: 5px; height: 5px; background: #c41e3a;
      border-radius: 50%; animation: blink 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%,80%,100% { opacity: 0.15; transform: scale(0.75); }
      40% { opacity: 1; transform: scale(1); }
    }
    .loading-label { font-size: 11px; color: #505050; letter-spacing: 0.18em; text-transform: uppercase; }

    .empty {
      padding: 56px 24px; text-align: center;
    }
    .empty-eye { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: #505050; margin-bottom: 14px; }
    .empty-h { font-size: 18px; font-weight: 300; color: #f0ebe3; margin-bottom: 10px; line-height: 1.3; }
    .empty-sub { font-size: 12px; color: #505050; line-height: 1.6; max-width: 260px; margin: 0 auto 28px; }

    .stats-row {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 1px; background: #1e1e1e; border-bottom: 1px solid #1e1e1e;
    }
    .stat { background: #080808; padding: 14px; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .stat-key { font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; color: #505050; margin-top: 5px; }
    .stat-delta { font-size: 9px; color: #3d8b5e; margin-top: 3px; }

    .body { padding: 18px 18px 4px; }

    .section {
      margin-bottom: 14px; background: #111;
      border: 1px solid #282828; border-radius: 9px; overflow: hidden;
    }
    .sec-head {
      padding: 11px 14px; border-bottom: 1px solid #1e1e1e;
      display: flex; align-items: center; gap: 9px;
    }
    .sec-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-red { background: #c41e3a; }
    .dot-yellow { background: #c49a00; }
    .dot-dim { background: #505050; }
    .sec-title { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #505050; }
    .sec-body { padding: 14px 15px; }

    .pri-list { display: flex; flex-direction: column; gap: 10px; }
    .pri-item { display: flex; gap: 12px; align-items: baseline; }
    .pri-num { font-size: 11px; color: #c41e3a; font-weight: 700; min-width: 16px; flex-shrink: 0; }
    .pri-text { font-size: 13px; color: #f0ebe3; line-height: 1.5; }

    .post-list { display: flex; flex-direction: column; gap: 10px; }
    .post { padding: 10px 12px; background: #181818; border-radius: 5px; }
    .post-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .post-badge {
      font-size: 8px; font-weight: 700; letter-spacing: 0.15em;
      padding: 2px 6px; border-radius: 3px; background: #8b0000; color: #f0ebe3;
    }
    .post-views { font-size: 11px; color: #505050; margin-left: auto; }
    .post-title { font-size: 12px; color: #f0ebe3; line-height: 1.4; font-style: italic; }

    .flag-list { display: flex; flex-direction: column; gap: 9px; }
    .flag {
      font-size: 13px; color: #f0ebe3; line-height: 1.5;
      padding-left: 14px; position: relative;
    }
    .flag::before { content: '—'; position: absolute; left: 0; color: #505050; font-size: 11px; }

    .plain { font-size: 13px; color: #f0ebe3; line-height: 1.6; }

    .notice {
      margin: 0 18px 14px;
      padding: 14px 15px;
      background: rgba(139,0,0,0.08);
      border: 1px solid rgba(196,30,58,0.18);
      border-left: 3px solid #c41e3a;
      border-radius: 5px;
    }
    .notice-label { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: #c41e3a; margin-bottom: 7px; }
    .notice-text { font-size: 13px; line-height: 1.55; }

    .actions { padding: 18px 18px 36px; display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 13px; background: transparent;
      border: 1px solid #282828; border-radius: 6px;
      color: #505050; font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn:hover:not(:disabled) { border-color: #c41e3a; color: #f0ebe3; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-solo { width: auto; padding: 13px 28px; margin: 0 auto; display: block; }

    .error { padding: 40px 20px; text-align: center; color: #505050; font-size: 13px; line-height: 1.7; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="header">
  <div class="wordmark">venus bleeds</div>
  <div class="title">weekly audit</div>
  <div class="subtitle" id="week-range"></div>
</div>

<div id="s-loading" class="loading hidden">
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="loading-label">reading the week</div>
</div>

<div id="s-empty" class="empty">
  <div class="empty-eye">monday ritual</div>
  <div class="empty-h">run your weekly audit</div>
  <div class="empty-sub">what went out, what's working, what to kill, what to film next.</div>
  <button class="btn btn-solo" onclick="runAudit()">run audit</button>
</div>

<div id="s-content" class="hidden">
  <div class="stats-row" id="stats-row"></div>
  <div class="body">
    <div class="section">
      <div class="sec-head"><div class="sec-dot dot-red"></div><div class="sec-title">this week's priorities</div></div>
      <div class="sec-body"><div class="pri-list" id="priorities"></div></div>
    </div>
    <div class="section">
      <div class="sec-head"><div class="sec-dot dot-dim"></div><div class="sec-title">what went out</div></div>
      <div class="sec-body"><div class="post-list" id="posts"></div></div>
    </div>
    <div class="section">
      <div class="sec-head"><div class="sec-dot dot-yellow"></div><div class="sec-title">pattern flags</div></div>
      <div class="sec-body"><div class="flag-list" id="flags"></div></div>
    </div>
    <div class="section">
      <div class="sec-head"><div class="sec-dot dot-red"></div><div class="sec-title">what to kill</div></div>
      <div class="sec-body"><div class="plain" id="kill"></div></div>
    </div>
  </div>
  <div class="notice">
    <div class="notice-label">one thing you haven't asked about</div>
    <div class="notice-text" id="notice"></div>
  </div>
  <div class="actions">
    <button class="btn" id="rerun-btn" onclick="runAudit()">↻ &nbsp;re-run</button>
  </div>
</div>

<div id="s-error" class="error hidden">
  couldn't run the audit — try again.<br>
  <span id="err-msg" style="font-size:10px;color:#333"></span>
  <div style="margin-top:16px">
    <button class="btn btn-solo" onclick="runAudit()" style="flex:none">retry</button>
  </div>
</div>

<script>
  // Week range label
  const now = new Date();
  const d = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() + (d === 0 ? -6 : 1 - d));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = x => x.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('week-range').textContent = (f(mon)+' – '+f(sun)).toLowerCase();

  function show(id) {
    ['s-loading','s-empty','s-content','s-error'].forEach(s =>
      document.getElementById(s).classList.toggle('hidden', s !== id)
    );
  }

  function extractJSON(str) {
    if (typeof str !== 'string') str = JSON.stringify(str);
    try { return JSON.parse(str); } catch(e) {}
    const stripped = str.replace(/^[\s\S]*?```(?:json)?\s*/i,'').replace(/\s*```[\s\S]*$/i,'').trim();
    try { return JSON.parse(stripped); } catch(e) {}
    const m = str.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch(e) {} }
    throw new Error('Could not parse JSON from response');
  }

  function render(data) {
    // Stats
    const statsEl = document.getElementById('stats-row');
    statsEl.innerHTML = (data.stats || []).slice(0,3).map(s => `
      <div class="stat">
        <div class="stat-val">${s.value||'—'}</div>
        <div class="stat-key">${s.label||''}</div>
        ${s.delta ? `<div class="stat-delta">${s.delta}</div>` : ''}
      </div>`).join('');

    // Priorities
    document.getElementById('priorities').innerHTML =
      (data.priorities||[]).map((p,i) =>
        `<div class="pri-item"><span class="pri-num">${i+1}</span><span class="pri-text">${p}</span></div>`
      ).join('');

    // Posts
    document.getElementById('posts').innerHTML =
      (data.posts||[]).map(p =>
        `<div class="post">
          <div class="post-top">
            <span class="post-badge">${p.type||'?'}</span>
            ${p.views ? `<span class="post-views">${p.views}</span>` : ''}
          </div>
          <div class="post-title">${p.title||''}</div>
        </div>`
      ).join('');

    // Flags
    document.getElementById('flags').innerHTML =
      (data.flags||[]).map(f => `<div class="flag">${f}</div>`).join('');

    // Kill
    document.getElementById('kill').textContent = data.kill || '—';

    // Notice
    document.getElementById('notice').textContent = data.notice || '';

    show('s-content');
    const btn = document.getElementById('rerun-btn');
    if (btn) btn.disabled = false;
  }

  async function runAudit() {
    show('s-loading');
    const btn = document.getElementById('rerun-btn');
    if (btn) btn.disabled = true;

    const BRIEF = `You are Creative Strategist for Venus Bleeds (@venusbleeds) — queer Lebanese musician, Paris-based. Dark/alt pop. Label: Burning Sanctuary. The Unself (2026). ~26.5K TikTok followers → 100K. Audience: queer Arab/MENA diaspora men 18–32.

ANALYTICS (Jun 2026): 1.2M views last 7d (+4369%), 213K likes, 7.1K shares, 8.5K profile views. Traffic: 95.6% FYP, 1% search, 0% sound. Viral #hijab P1: 1.1M views, 509 followers from 621K viewers (0.08% conversion — wrong room). Follow-up #hijab: 5.4K views, 11 followers. Reply to @Dani: 346 likes/2732 views = 12.7% like rate (core audience activated). "some women's choices" P2: 2.2K views. Collab post: 278 views.

POSTS THIS WEEK: P1 #hijab (viral), P2 "some women's choices are empowerment", P1 #hijab follow-up, reply to @Dani, collab with @carlasanslactose.

ACTIVE SERIES: White feminism thread — P2 script confirmed, NOT filmed yet.
QUEUED: P1 "it's all body positivity until the body is Arab", six-beat P1, Both Wrong P2, Savior Syllabus P2, Dress Code P2, first P3 artist piece.
DECISION: No #hijab hashtag. No forced music. Agency framing always.

Run a sharp honest weekly audit. Say what's off directly.

Reply with ONLY this JSON, nothing else:
{
  "stats": [
    {"label":"views","value":"1.2M","delta":"+4369%"},
    {"label":"likes","value":"213K","delta":"+9940%"},
    {"label":"shares","value":"7.1K","delta":"+8415%"}
  ],
  "priorities": [
    "specific action — not just 'film P2' but the exact thing with context",
    "specific action 2",
    "specific action 3"
  ],
  "posts": [
    {"type":"P1","title":"post hook or description","views":"1.1M"},
    {"type":"P2","title":"post hook or description","views":"2.2K"}
  ],
  "flags": [
    "specific pattern observation 1",
    "specific pattern observation 2",
    "specific pattern observation 3"
  ],
  "kill": "one clear sentence about what to stop or deprioritize",
  "notice": "one thing Venus hasn't asked about — a pattern, gap, or opportunity. Be direct."
}`;

    try {
      const raw = await window.cowork.askClaude(BRIEF);
      const data = extractJSON(raw);
      render(data);
    } catch(e) {
      document.getElementById('err-msg').textContent = e.message || '';
      show('s-error');
      console.error('audit error:', e);
    }
  }
</script>
</body>
</html>
